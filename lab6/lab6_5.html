<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Функция showPrompt — улучшенная версия</title>
    <style>
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid #e0e0e0;
        }

        .modal-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        #modal-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        #modal-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .modal-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        #modal-ok {
            background-color: #27ae60;
            color: white;
        }

        #modal-ok:hover {
            background-color: #219955;
        }

        #modal-cancel {
            background-color: #e74c3c;
            color: white;
        }

        #modal-cancel:hover {
            background-color: #c0392b;
        }

        #modal-form {
            display: flex;
            flex-direction: column;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <script>
        'use strict';

        function showPrompt(html, callback) {
            let overlay = document.createElement('div');
            overlay.id = 'modal-overlay';
            document.body.appendChild(overlay);

            let modal = document.createElement('div');
            modal.id = 'modal';
            overlay.appendChild(modal);

            modal.innerHTML = `
                <div class="modal-title">${html}</div>
                <form id="modal-form">
                    <input type="text" id="modal-input" placeholder="Введите текст здесь...">
            <div class="button-container">
                <button type="button" class="modal-button" id="modal-ok">Подтвердить</button>
                <button type="button" class="modal-button" id="modal-cancel">Отмена</button>
            </div>
                </form>
            `;

            overlay.style.display = 'flex';
            let input = document.getElementById('modal-input');
            input.focus();

            document.getElementById('modal-ok').onclick = function () {
                callback(input.value);
                closeModal();
            };

            document.getElementById('modal-cancel').onclick = function () {
                callback(null);
                closeModal();
            };

            input.onkeydown = function (event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    callback(input.value);
                    closeModal();
                } else if (event.key === 'Escape') {
                    callback(null);
                    closeModal();
                }
            };

            function closeModal() {
                document.body.removeChild(overlay);
            }

            modal.onkeydown = function (event) {
                if (event.key === 'Tab') {
                    let focusableElements = modal.querySelectorAll('input, button');
            let index = Array.prototype.indexOf.call(focusableElements, document.activeElement);
            if (event.shiftKey)
                index--;
            else
                index++;

            if (index >= focusableElements.length)
                index = 0;

            if (index < 0)
                index = focusableElements.length - 1;

            focusableElements[index].focus();
            event.preventDefault();
                }
            };
        }

        showPrompt("Пожалуйста, введите ваши данные:", function (value) {
            alert(value !== null ? `Вы ввели: ${value}` : "Ввод отменён");
        });
    </script>

</body>
</html>
