<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная таблица данных</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333333;
            background-color: #f8f9fa;
            padding: 20px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        table {
            border-collapse: separate;
            border-spacing: 15px;
            width: 100%;
            font-size: 18px;
        }

        th,
        td {
            border: 3px solid #4a6fa5;
            background-color: #e6f2ff;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        th {
            background-color: #2c5aa0;
            color: white;
            font-weight: 600;
            position: relative;
        }

        th::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: #4a6fa5;
        }

        td:hover {
            background-color: #d1e6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.2);
        }

        td textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            resize: none;
            background-color: #ffffff;
            border: 2px solid #a0c4ff;
            border-radius: 6px;
            padding: 10px;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        td textarea:focus {
            outline: none;
            border-color: #2c5aa0;
            box-shadow: 0 0 0 2px rgba(44, 90, 160, 0.2);
        }

        .edit-buttons {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .ok-button,
        .cancel-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .ok-button {
            background-color: #4a6fa5;
            color: white;
        }

        .ok-button:hover {
            background-color: #3a5a8a;
        }

        .cancel-button {
            background-color: #ff6b6b;
            color: white;
        }

        .cancel-button:hover {
            background-color: #ff5252;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="table-container">
        <table id="editable-table">
            <thead>
                <tr>
                    <th>Категория</th>
                    <th>Описание</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Проект А</td>
                    <td>Разработка веб‑интерфейса</td>
                </tr>
                <tr>
                    <td>Проект Б</td>
                    <td>Оптимизация базы данных</td>
                </tr>
                <tr>
                    <td>Проект В</td>
                    <td>Тестирование функционала</td>
                </tr>
                <tr>
                    <td>Проект Г</td>
                    <td>Документирование API</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        'use strict';

        const table = document.getElementById('editable-table');

        if (sessionStorage.tableData) table.innerHTML = sessionStorage.tableData;

        table.onclick = function (e) {
            const btn = e.target.closest('button');
            const td = e.target.closest('td');

            if (btn) {
                const currentTd = btn.closest('td');
                const isSave = btn.className === 'ok-button';
                currentTd.innerHTML = isSave ? currentTd.querySelector('textarea').value : currentTd.dataset.original;
                if (isSave) sessionStorage.tableData = table.innerHTML;
                return;
            }

            if (td && !table.querySelector('textarea') && e.target.tagName !== 'TEXTAREA') {
                td.dataset.original = td.innerHTML;
                td.innerHTML = `<textarea>${td.innerHTML.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m])}</textarea>
                <div class="edit-buttons"><button class="ok-button">Сохранить</button><button class="cancel-button">Отмена</button></div>`;
                td.querySelector('textarea').focus();
            }
        };
    </script>
</body>
</html>
