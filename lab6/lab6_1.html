<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Жанр</title>
</head>

<body>

    <select id="genre">
        <option value="Rock">Рок</option>
        <option value="Blues">Блюз</option>
        <option value="Classic" selected>Классика</option>
    </select>
    <div id="selected-info">
        <p>Выбранный элемент: <span id="selElement"></span></p>
        <p>Выбранный текст: <span id="selName"></span></p>
    </div>

    <script>
        'use strict';
        const dropdown = document.getElementById('genre');
        const codeDisplay = document.getElementById('selElement');
        const nameDisplay = document.getElementById('selName');

        function updateSelection() {
            const currentOption = dropdown.options[dropdown.selectedIndex];
            codeDisplay.textContent = selectedOption.value;
            nameDisplay.textContent = selectedOption.text;
        }

        updateSelection();
        dropdown.addEventListener('change', updateSelection);
    </script>
</body>
</html>
