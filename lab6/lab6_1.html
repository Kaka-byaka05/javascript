<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Работа с select</title>
</head>
<body>

  <select id="music-genre">
    <option value="Rock">Рок</option>
    <option value="Blues">Блюз</option>
  </select>

  <br><br>
  <div id="result">Результат будет здесь</div>

  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', function() {
      const selectElement = document.getElementById('music-genre');

      const newOption = document.createElement('option');
      newOption.value = 'Classic';
      newOption.textContent = 'Классика';

      selectElement.appendChild(newOption);

      selectElement.value = 'Classic';

      const selectedOption = selectElement.options[selectElement.selectedIndex];

      const resultText = 'Выбрано:\n' +
                      '- Значение (value): ' + selectedOption.value + '\n' +
              '- Текст опции: ' + selectedOption.text;

      console.log(resultText);
      document.getElementById('result').textContent = resultText;

      selectElement.addEventListener('change', function() {
        const currentOption = selectElement.options[selectElement.selectedIndex];
        const updatedResult = 'Выбрано:\n' +
                        '- Значение (value): ' + currentOption.value + '\n' +
                '- Текст опции: ' + currentOption.text;
        document.getElementById('result').textContent = updatedResult;
      });
    });
  </script>

</body>
</html>
