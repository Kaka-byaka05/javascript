<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Жанр</title>
</head>

<body>

    <select id="genre">
        <option value="Rock">Рок</option>
        <option value="Blues">Блюз</option>
        <option value="Classic" selected>Классика</option>
    </select>
    <div id="selected-info">
        <p>Выбранный элемент: <span id="selElement"></span></p>
        <p>Выбранный текст: <span id="selName"></span></p>
    </div>

    <script>
        'use strict';

        const selDiv = document.getElementById('genre');
        const selectedElement = document.getElementById('selElement');
        const selectedName = document.getElementById('selName');

        function selOutput() {
            const selectedOption = selDiv.options[selDiv.selectedIndex];
            selectedElement.textContent = selectedOption.value;
            selectedName.textContent = selectedOption.text;
        }
        
        selOutput();
        selDiv.addEventListener('change', selOutput);
    </script>
</body>

</html>
